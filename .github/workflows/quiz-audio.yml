name: Polski lektor offline
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - .github/workflows/quiz-audio.yml
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalacja darmowego syntezatora
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Generowanie polskich nagrań
        shell: bash
        run: |
          python3 - <<'PY'
          import re, json, pathlib, subprocess, tempfile
          bank = json.loads(re.search(r'<script id="bank" type="application/json">(.*?)</script>', pathlib.Path('index.html').read_text(), re.S).group(1))
          assert len(bank) == 80 and all(len(row) == 5 for row in bank)
          out = pathlib.Path('audio')
          out.mkdir(exist_ok=True)
          samples = {}
          for i, row in enumerate(bank):
              for j, text in enumerate(row):
                  samples[f'q{i}_{j}'] = text
          for i, letter in enumerate(['A', 'B', 'C', 'D']):
              samples[f'letter{i}'] = 'Odpowiedź ' + letter
          samples.update({'correct':'Poprawna odpowiedź!', 'incorrect':'Niepoprawna odpowiedź. Poprawna odpowiedź to:', 'test':'To jest test polskiego lektora. Witaj w quizie MOW.', 'end':'Koniec testu. Poprawne odpowiedzi:', 'of':'z'})
          for i in range(81):
              samples[f'number{i}'] = str(i)
          with tempfile.TemporaryDirectory() as temp:
              wav = str(pathlib.Path(temp) / 'speech.wav')
              for name, text in samples.items():
                  subprocess.run(['espeak-ng','-v','pl','-s','145','-w',wav,text],check=True,stdout=subprocess.DEVNULL)
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',wav,'-ac','1','-ar','22050','-b:a','48k',str(out / (name + '.mp3'))],check=True)
          (out/'ready.json').write_text(json.dumps({'version':1,'files':len(samples),'voice':'espeak-ng pl'}))
          PY
      - name: Zapis nagrań
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Wygeneruj polskie nagrania quizu"
            git push
          fi
