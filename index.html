function questionVoice(){var q=deck[pos],row=bank[q.id],t=row[0],f=['q'+q.id+'_0'];q.order.forEach(function(a,i){t+=' '+letters[i]+'. '+row[a+1]+'.';f.push('letter'+i,'q'+q.id+'_'+(a+1))});speak(t,f)}
function quiz(){clearDwell();view='quiz';answered=false;selected=-1;sayStatus('');var q=deck[pos],row=bank[q.id],correct=q.order.indexOf(0);screen.innerHTML='<p class="sub">'+esc(cats[Math.floor(q.id/20)])+' · pytanie '+(pos+1)+' z '+deck.length+(mode==='training'?' · '+score+' pkt':'')+'</p><div class="bar"><div class="fill" style="width:'+((pos+1)/deck.length*100)+'%"></div></div><h2>'+esc(row[0])+'</h2><div class="choices" id="choices"></div>';buttons=[];q.order.forEach(function(a,i){var b=document.createElement('button');b.type='button';b.innerHTML='<span class="letter">'+letters[i]+'.</span>'+esc(row[a+1]);b.onclick=function(){choose(i)};document.getElementById('choices').appendChild(b);buttons.push(b)});focusAt(0,false);questionVoice();if(dwell)sayStatus('Porusz strzałką, aby rozpocząć odliczanie 5 s.')}
function choose(i){if(view!=='quiz'||answered||i<0||i>3)return;clearDwell();stopVoice();answered=true;selected=i;var q=deck[pos],correct=q.order.indexOf(0),ok=i===correct;if(ok)score++;else wrong.push(q.id);if(mode==='exam'){nextQuestion();return}buttons[correct].classList.add('good');if(!ok)buttons[i].classList.add('bad');buttons.forEach(function(b){b.disabled=true});var t=ok?'Poprawna odpowiedź!':'Niepoprawna odpowiedź. Poprawna: '+bank[q.id][1];sayStatus(t);var b=document.createElement('button');b.type='button';b.textContent=pos===deck.length-1?'Zobacz wynik':'Następne pytanie →';b.onclick=nextQuestion;screen.appendChild(b);buttons=[b];focusAt(0,false);speak(t,ok?['correct']:['incorrect','q'+q.id+'_1'])}
function nextQuestion(){stopVoice();pos++;if(pos>=deck.length)result();else quiz()}
function result(){clearDwell();view='result';var bad=wrong.slice(),pct=Math.round(score/deck.length*100);sayStatus('');var items=[['Nowy test',home]];if(bad.length)items.unshift(['Powtórz błędy ('+bad.length+')',function(){start(bad)}]);draw('Koniec testu',mode==='training'?'Wynik treningu':'Wynik testu',items,'<p class="result">'+score+' / '+deck.length+' pkt · '+pct+'%</p><p>Poprawne: '+score+' · błędne: '+bad.length+'</p>');speak('Koniec testu. Poprawne odpowiedzi: '+score+' z '+deck.length+'.', ['end','number'+score,'of','number'+deck.length])}
function settings(){stopVoice();view='settings';sayStatus('');draw('Ustawienia','Bez konta i bez opłat. Ustawienia są zapamiętywane na tym urządzeniu.',[['Lektor: '+(voiceOn?'włączony':'wyłączony'),function(){voiceOn=!voiceOn;save();updateSound();settings()}],['Tempo: '+(speed===0.8?'wolne':speed===1.2?'szybkie':'normalne'),function(){speed=speed===0.8?1:speed===1?1.2:0.8;save();settings()}],['Zatwierdzanie po 5 s: '+(dwell?'włączone':'wyłączone'),function(){dwell=!dwell;save();settings()}],['Test głosu',function(){speak('To jest test polskiego lektora. Witaj w quizie MOW.', ['test'],true)}],['Powrót',home]],'<p>Strzałka w prawo zatwierdza wybór bez przycisku OK. Opcjonalny tryb 5 sekund działa po zmianie odpowiedzi strzałką.</p>')}
function diag(){stopVoice();view='diag';sayStatus('Naciśnij dowolny przycisk pilota.');draw('Test pilota i dźwięku','Sprawdź strzałki, OK, kolory i cyfry.',[['Odtwórz próbkę lektora',function(){speak('To jest test polskiego lektora. Witaj w quizie MOW.', ['test'],true)}],['Powrót do menu',home]],'<p id="diagkeys">Oczekiwanie na klawisz...</p><p id="diagtech">'+esc('Nagrania: '+(audioReady?'dostępne':'nie wykryto')+' · Web Speech: '+(window.speechSynthesis?'API dostępne':'brak API'))+'</p><p class="sub">'+esc(navigator.userAgent)+'</p>')}
function repeat(){if(view==='quiz'&&!answered)questionVoice();else if(speechText)speak(speechText,speechFiles,true)}
function toggleVoice(){voiceOn=!voiceOn;save();updateSound();if(!voiceOn)stopVoice();else if(view==='quiz'&&!answered)questionVoice()}
function activate(){if(buttons[cursor]&&!buttons[cursor].disabled)buttons[cursor].click()}
document.addEventListener('keydown',function(e){var k=e.key||'',c=e.keyCode||e.which||0;var up=k==='ArrowUp'||c===38,down=k==='ArrowDown'||c===40,left=k==='ArrowLeft'||c===37,right=k==='ArrowRight'||c===39,ok=k==='Enter'||c===13||k==='Accept'||c===23||c===66||k===' '||c===32,green=c===404||c===184||k==='ColorF1Green',red=c===403||c===183||k==='ColorF0Red',yellow=c===405||c===185||k==='ColorF2Yellow',blue=c===406||c===186||k==='ColorF3Blue';var digit=/^[1-4]$/.test(k)?Number(k):c>=49&&c<=52?c-48:c>=97&&c<=100?c-96:0;
if(view==='diag'){var d=document.getElementById('diagkeys');if(d){testLog.unshift('key='+k+' · code='+c);testLog=testLog.slice(0,5);d.textContent=testLog.join(' | ')}}
if(!(up||down||left||right||ok||green||red||yellow||blue||digit||k==='Escape'))return;e.preventDefault();e.stopPropagation();if((ok||right||green||digit)&&Date.now()-lastKey<320)return;if((ok||right||green||digit)&&(e.repeat))return;if(ok||right||green||digit)lastKey=Date.now();
if(red||k==='Escape'){home();return}if(yellow){repeat();return}if(blue){toggleVoice();return}if(up||down||left){focusAt(cursor+(down?1:-1),true);return}if(digit&&view==='quiz'&&!answered){choose(digit-1);return}if(right||ok||green){activate()}
},true);
window.addEventListener('pagehide',stopVoice);updateSound();home();
})();
</script></body></html>
